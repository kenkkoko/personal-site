  --line:rgba(255,255,255,.09);
  --line-soft:rgba(255,255,255,.05);

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}

nav a{font-size:13.5px;font-weight:500;color:var(--text);padding:8px 15px;border-radius:999px;

nav a:hover{color:var(--ink)}
nav a.active{color:var(--ink);background:var(--glass-2)}

section{position:relative}

.rv.in{opacity:1;transform:none}

.rv[data-d="3"]{transition-delay:.21s}.rv[data-d="4"]{transition-delay:.28s}

.scroll-cue i{width:1px;height:38px;background:linear-gradient(var(--faint),transparent);

  ext:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M9 7h8v8"/></svg>',

const isExt = u => /^https?:/i.test(u||"");

/* ---------- scroll reveal (defined early so renderers can use it) ---------- */
const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}
}),{threshold:.12,rootMargin:"0px 0px -6% 0px"});
function observe(els){els.forEach(el=>io.observe(el));}

/* ---------- nav ---------- */
document.getElementById("nav").innerHTML =
  DATA.nav.map(n=>`<a href="${n.href}"${n.opt?' data-opt':''}>${n.label}</a>`).join("");

/* ---------- hero ---------- */

document.getElementById("sub").textContent = DATA.hero.sub;
document.getElementById("zh").textContent  = DATA.hero.zh;

/* ---------- about ---------- */
document.getElementById("aboutText").innerHTML = DATA.about;
{
  const L=DATA.links, S=[];
  if(L.github)   S.push(`<a href="${L.github}"   target="_blank" rel="noopener" aria-label="GitHub">${ICON.github}</a>`);
  if(L.linkedin) S.push(`<a href="${L.linkedin}" target="_blank" rel="noopener" aria-label="LinkedIn">${ICON.linkedin}</a>`);
  if(L.behance)  S.push(`<a href="${L.behance}"  target="_blank" rel="noopener" aria-label="Behance">${ICON.behance}</a>`);

}

/* ---------- experience ---------- */
document.getElementById("expList").innerHTML = DATA.experience.map(e=>{
  const blocks = e.blocks.map(b=>`<div class="blk"><h4>${b.h}</h4><ul>${
      b.items.map(i=>`<li>${i}</li>`).join("")}</ul></div>`).join("");
  const tags = (e.tech||[]).map(t=>`<span class="tag">${t}</span>`).join("");
  return `<div class="exp-card rv${e.open?' open':''}">
    <button class="exp-head" aria-expanded="${!!e.open}">
      <div><div class="exp-role">${e.role}</div><div class="exp-org">${e.org}${e.loc?'  ｜  '+e.loc:''}</div></div>
      <div class="exp-right"><span class="exp-period">${e.period}</span>${ICON.chev}</div>
    </button>
    <div class="exp-body"><div class="exp-bw"><div class="exp-inner">${blocks}<div class="tags">${tags}</div></div></div></div>
  </div>`;
}).join("");
document.querySelectorAll(".exp-head").forEach(h=>{
  h.addEventListener("click",()=>{
    const c=h.closest(".exp-card"), open=c.classList.toggle("open");
    h.setAttribute("aria-expanded",open);
  });
});

/* ---------- projects + filters ---------- */
const grid=document.getElementById("projGrid");
function projCard(p){
  const links=(p.links||[]).map(l=>{
    const ext=isExt(l.url);
    return `<a class="plink" href="${l.url}" ${ext?'target="_blank" rel="noopener"':''}>${l.label}${ext?ICON.ext:''}</a>`;
  }).join("");
  const tags=(p.tech||[]).map(t=>`<span class="tag">${t}</span>`).join("");
  const badge = p.badge ? `<span class="badge${/Live/i.test(p.badge)?'':' ghost'}">${p.badge}</span>` : "";
  return `<article class="card rv" data-cats="${(p.cats||[]).join(',')}">
    <div class="card-top"><h3>${p.title}</h3>${badge}</div>
    <p>${p.desc}</p>
    ${links?`<div class="card-links">${links}</div>`:""}
    <div class="tags">${tags}</div>
  </article>`;
}
function renderProjects(filter){
  grid.innerHTML = DATA.projects
    .filter(p => filter==="All" || (p.cats||[]).includes(filter))
    .map(projCard).join("");
  observe(grid.querySelectorAll(".rv"));
}
document.getElementById("filters").innerHTML =
  DATA.projectFilters.map((f,i)=>`<button class="${i===0?'on':''}">${f}</button>`).join("");
document.querySelectorAll("#filters button").forEach(b=>{
  b.addEventListener("click",()=>{
    document.querySelectorAll("#filters button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    renderProjects(b.textContent);
  });
});
renderProjects("All");

observe(document.querySelectorAll(".rv"));

/* ---------- nav active (scroll-spy) ---------- */
const navLinks=[...document.querySelectorAll("#nav a")];
const secs=DATA.nav.map(n=>document.querySelector(n.href)).filter(Boolean);
const spy=new IntersectionObserver(es=>{
  es.forEach(e=>{ if(e.isIntersecting){
    navLinks.forEach(a=>a.classList.toggle("active",a.getAttribute("href")==="#"+e.target.id));
  }});
},{rootMargin:"-45% 0px -50% 0px"});
secs.forEach(s=>spy.observe(s));

/* ---------- animated, mouse-interactive low-poly background (original, canvas2d) ---------- */
const poly=document.getElementById("poly");
const cvs=document.createElement("canvas"); poly.appendChild(cvs);
const ctx=cvs.getContext("2d");
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let W,H,DPR,cols,rows,pts,tris,raf;
const mouse={x:0,y:0,has:false}, light={x:0,y:0};

function setup(){
  W=innerWidth; H=Math.max(innerHeight,1); DPR=Math.min(devicePixelRatio||1,2);
  cvs.width=W*DPR; cvs.height=H*DPR; cvs.style.width=W+"px"; cvs.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
  cols=Math.max(7,Math.round(W/130)); rows=Math.max(6,Math.round(H/130));
  const cw=W/cols, ch=H/rows; pts=[];
  for(let y=0;y<=rows;y++)for(let x=0;x<=cols;x++){
    const ex=(x===0||x===cols), ey=(y===0||y===rows);
    const bx=x*cw+(ex?0:(Math.random()-.5)*cw*.66), by=y*ch+(ey?0:(Math.random()-.5)*ch*.66);
    pts.push({bx,by,x:bx,y:by,
      ax:ex?0:5+Math.random()*9, ay:ey?0:5+Math.random()*9,      // drift amplitude
      sx:.3+Math.random()*.5,    sy:.3+Math.random()*.5,         // drift speed
      px:Math.random()*6.283,    py:Math.random()*6.283});       // phase
  }
  tris=[]; const id=(x,y)=>y*(cols+1)+x;
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    const a=id(x,y),b=id(x+1,y),c=id(x,y+1),d=id(x+1,y+1);
    if((x+y)%2===0){tris.push([a,b,d],[a,d,c]);}else{tris.push([a,b,c],[b,d,c]);}
  }
  light.x=W*.42; light.y=H*.46;
  if(reduce){draw(0);}            // static frame if user prefers reduced motion
}
function draw(t){
  for(const p of pts){
    p.x=p.bx+Math.sin(t*0.001*p.sx+p.px)*p.ax;
    p.y=p.by+Math.cos(t*0.001*p.sy+p.py)*p.ay;
  }
  const tx=mouse.has?mouse.x:W*.42+Math.sin(t*0.0003)*W*.14;     // light follows cursor,
  const ty=mouse.has?mouse.y:H*.46+Math.cos(t*0.00026)*H*.14;    // else drifts slowly
  light.x+=(tx-light.x)*.06; light.y+=(ty-light.y)*.06;
  const md=Math.hypot(W,H);
  ctx.clearRect(0,0,W,H);
  ctx.lineWidth=.8;
  for(const tr of tris){
    const a=pts[tr[0]],b=pts[tr[1]],c=pts[tr[2]];
    const mx=(a.x+b.x+c.x)/3,my=(a.y+b.y+c.y)/3;
    const d=Math.hypot(mx-light.x,my-light.y)/md;
    let l=16-d*15; if(l<3.5)l=3.5;
    const col="hsl(240 7% "+l.toFixed(1)+"%)";
    ctx.fillStyle=col; ctx.strokeStyle="hsl(240 7% "+(l+.8).toFixed(1)+"%)";
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.lineTo(c.x,c.y); ctx.closePath();
    ctx.fill(); ctx.stroke();
  }
}
function loop(t){ draw(t); raf=requestAnimationFrame(loop); }
setup();
if(!reduce) raf=requestAnimationFrame(loop);
addEventListener("pointermove",e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.has=true;},{passive:true});
addEventListener("pointerleave",()=>{mouse.has=false;});
let rt; addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(setup,180);});
</script>
